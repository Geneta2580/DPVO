### DPVO Config File ###

# VO config (increase for better accuracy)
PATCHES_PER_FRAME: 96
REMOVAL_WINDOW: 22
OPTIMIZATION_WINDOW: 10
PATCH_LIFETIME: 13

# threshold for keyframe removal
KEYFRAME_THRESH: 15.0

# camera motion model
MOTION_MODEL: 'DAMPED_LINEAR'
MOTION_DAMPING: 0.5

# maybe use mixed precision for inference
MIXED_PRECISION: True

CENTROID_SEL_STRAT: 'RANDOM'

# IMU config (EuRoC)
IMU_GRAVITY: 9.81
IMU_ACCEL_NOISE: 0.002
IMU_GYRO_NOISE: 0.0001
IMU_ACCEL_BIAS_RW: 0.0001
IMU_GYRO_BIAS_RW: 0.00001


# VIO initialization
VIO_INIT_MIN_FRAMES: 15
VIO_INIT_MIN_TIME: 1.0
VIO_INIT_MIN_ACC_VAR: 0.25
VIO_INIT_MIN_VISUAL_PATH: 0.05
VIO_INIT_MIN_VISUAL_BASELINE: 0.02
VIO_INIT_SOLVE_MIN_FRAMES: 40
VIO_INIT_SOLVE_INTERVAL: 5
VIO_INIT_ACCEPT_COUNT: 5
VIO_INIT_ACCEPT_REL_STD: 0.05

# Visual-IMU extrinsic T_bc (body/IMU -> camera), 4x4 row-major
T_BC: [0.0148655429818, -0.999880929698, 0.00414029679422, -0.0216401454975,
       0.999557249008, -0.0149672133247, 0.025715529948, -0.064676986768,
       -0.0257744366974, 0.00375618835797, 0.999660727178, 0.00981073058949,
       0.0, 0.0, 0.0, 1.0]